hugoblox:
  schema: '2.0'

  identity:
    name: Sean
    organization: ''
    type: person
    tagline: Personal homepage and blog
    description: Notes on learning, research, technology, reading, and everyday life.
    social: {}

  theme:
    mode: system
    pack: default
    colors:
      primary: stone
      secondary: amber
      neutral: stone

  typography:
    pack: academic

  layout:
    radius: none
    spacing: comfortable
    avatar_shape: rounded

  header:
    enable: true
    align: center
    sticky: false
    show_logo: true
    show_title: false
    search: true
    theme_toggle: true
    language_switcher: true

  footer:
    language_switcher: false
    copyright:
      notice: '© {year} Sean.'

  locale:
    date_format: '2006-01-02'
    time_format: '15:04'

  features:
    syntax_highlighter:
      theme_light: github-light
      theme_dark: github-dark
    math:
      enable: true
    privacy_pack:
      enable: false
